name: VUF source and manifest checks
# COST CONTROL: no automatic workflow per commit or PR.
# Explicit manual dispatch is optional; use scripts/run_source_checks.ps1 locally by default.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Manifest positive/negative tests
        run: python -m unittest discover -s tests -v
      - name: Verify five draft style profiles and 28 Coral experiences
        run: python factory/validators/validate_design.py
      - name: Assert portable package metadata and package locations
        run: |
          python -m json.tool unity_package/package.json > /dev/null
          python -m json.tool unity_package/Runtime/Match3.VisualFactory.Runtime.asmdef > /dev/null
          python -m json.tool unity_package/Editor/Match3.VisualFactory.Editor.asmdef > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("Packages/manifest.json").read_text())
          assert data["dependencies"]["com.match3.visual-factory"] == "file:../unity_package"
          assert Path("unity_package/Editor/VufStudioWindow.cs").is_file()
          assert Path("unity_package/Editor/VufDashboardWindow.cs").is_file()
          assert not Path("Assets/Editor/VufStudioWindow.cs").exists()
          PY
      - name: Offline VFX preset contract validation
        run: python factory/vfx_builder/validate_presets.py
      - name: Package isolation and stable Unity GUID contract
        run: python Tools/validate_repo_structure.py
      - name: Python syntax compile
        run: python -m compileall -q Tools factory tests
      - name: Synthetic TEST_ONLY sample
        run: python Tools/validate_manifest.py Samples~/sample_manifest.json
      - name: Assert Unity version and project structure
        run: |
          grep -F 'm_EditorVersion: 6000.6.5f1' ProjectSettings/ProjectVersion.txt
          test -f unity_package/Editor/VufStudioWindow.cs
          python -m json.tool Packages/manifest.json > /dev/null
